<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Preload del solo peso regular: è usato dal primo paint; l'italic arriva col CSS -->
		<link
			rel="preload"
			href="/fonts/RethinkSans-VariableFont_wght.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Commento solo il PERCHÉ: disabilita il ripristino automatico dello scroll del browser prima del rendering per evitare salti visivi al refresh
			if ('scrollRestoration' in history) {
				history.scrollRestoration = 'manual';
			}
			// Il reload diretto mantiene la posizione di scroll a prescindere da scrollRestoration: i
			// ScrollTrigger pinnati verrebbero creati già "dentro" il proprio range, attivandosi in uno
			// stato incoerente (es. Performance in overlay su Intro) da cui gli smontaggi delle
			// navigazioni successive non si riprendono (DOM zombie, navbar duplicate). Doppia
			// protezione: azzera subito e fai salvare 0 al browser come posizione per il reload.
			window.scrollTo(0, 0);
			window.addEventListener('beforeunload', () => window.scrollTo(0, 0));
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
